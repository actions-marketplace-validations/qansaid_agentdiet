version: 2

project_name: agentdiet

before:
  hooks:
    - go mod tidy

builds:
  - id: agentdiet
    main: .
    binary: agentdiet
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # Hardcode the released tag into the binary so `agentdiet --version`
      # reports the version it was published as, not a value baked into the
      # source tree.
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  groups:
    - title: features
      regexp: '^feat'
      order: 0
    - title: fixes
      regexp: '^fix'
      order: 1
    - title: other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  draft: false
  prerelease: auto

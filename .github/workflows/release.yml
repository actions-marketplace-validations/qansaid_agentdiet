name: release

on:
  push:
    # Only immutable semver tags may trigger a release. A moving major tag (v1)
    # triggers a second publish onto a release that already carries assets and
    # fails with 422 already_exists.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the tag being released to the tag that triggered the run.
          # Without it goreleaser resolves the highest tag on the commit, so a
          # commit carrying both vX.Y.Z and the moving v1 publishes to v1.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

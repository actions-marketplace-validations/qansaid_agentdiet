name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "1.24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -race -count=1 -covermode=atomic -coverprofile=cover.out
      - name: build
        run: go build -trimpath -ldflags="-s -w" -o agentdiet .
      - name: version injection
        # Guard the release ldflags contract: a builder that drops -X main.version
        # must fail here, not ship a binary claiming the wrong version.
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=9.9.9-ci" -o agentdiet-version .
          got=$(./agentdiet-version --version)
          echo "binary reports: $got"
          test "$got" = "agentdiet 9.9.9-ci"
      - name: self-audit
        run: ./agentdiet . --json > /dev/null

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
